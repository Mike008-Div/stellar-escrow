[package]
name = "stellar-escrow"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Soroban escrow contract for freelance and cross-border payments"
repository = "https://github.com/stellar-invoice-protocol/stellar-escrow"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "22.0.0"

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
panic = "abort"
codegen-units = 1
lto = true
